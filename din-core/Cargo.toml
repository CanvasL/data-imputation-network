[package]
name = "din-core"
version = "0.1.0"
edition = "2021"
description = "Data Imputation Network (DIN) — core protocol reference implementation"

[lib]
name = "din_core"
path = "src/lib.rs"

[[bin]]
name = "din-demo"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
